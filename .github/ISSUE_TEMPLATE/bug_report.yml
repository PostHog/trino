---
name: Bug report 🐞
description: Problems, bugs and issues with Truffle
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        * Verify that the issue is not already reported by checking [open issues](https://github.com/PostHog/truffle/issues).
        * **Possible security vulnerabilities**: STOP here and contact `security@posthog.com` instead!
        * Do **NOT** share any sensitive information like customer data, passwords, security tokens, private URLs, or internal identifiers.

  - type: input
    attributes:
      label: Truffle version
      description: Which Truffle server version or commit are you using?
      placeholder: "Run `SELECT version();` on your Truffle server"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Please describe the bug
      description: Describe the problem, minimal steps to reproduce, expected and actual behaviors. If something fails, include a redacted stacktrace.
    validations:
      required: true
