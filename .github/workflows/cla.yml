name: CLA

# Needs the base repository's token to post CLA status on pull requests from
# forks, which is what pull_request_target exists for. It checks out
# github.workflow_sha rather than the pull request head, so no attacker
# controlled code runs, and persist-credentials is off. The job is also gated to
# trinodb/trino, so it never runs in this fork at all.
# nosemgrep: dotgithub-repo..semgrep.rules.github-actions-pull-request-target
on:
  # Safe despite the read-write token: no code from the PR is checked out or executed.
  # The checkout below is pinned to github.workflow_sha, the commit this workflow file was
  # loaded from. For pull_request_target and issue_comment events workflows are loaded from
  # a branch of the base repository (the PR base branch or the default branch respectively),
  # so that commit is never the PR head.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write

jobs:
  cla-signed:
    if: |
      github.repository == 'trinodb/trino' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request &&
          contains(fromJson('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.comment.author_association) &&
          (
            contains(github.event.comment.body, '@cla-bot check') ||
            contains(github.event.comment.body, '/cla-check')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check CLA
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const checkCla = require('./.github/bin/check-cla.js');
            await checkCla({github, context, core});
