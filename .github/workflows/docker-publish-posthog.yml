name: docker-publish-posthog

# Builds the PostHog fork's Trino server image (with the ducklake connector)
# for linux/arm64 and pushes it to GHCR. The managed-warehouse trino Karpenter
# node pool is arm64-only, so amd64 is skipped to keep CI fast.
#
# Every run also tells PostHog/charts what it built. Charts records the image
# in state/trino.yaml and rolls the dev cell; the prod cell moves only when
# somebody runs promote-to-prod, which the prod-promote-managed-warehouse
# environment gates. See the deploy job at the end of this file.

on:
  # A merge to the deployment branch builds and reaches the dev cell on its
  # own. Named releases and one-off rebuilds keep working through the other
  # two triggers.
  push:
    branches:
      - ducklake-connector
    tags:
      - "posthog-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish, e.g. 484-ducklake.1"
        required: true
        default: "484-ducklake.1"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/posthog/trino

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build trino-server tarball (skip tests and checks)
        # Full build: the trino-server provisio assembly resolves every plugin
        # zip plus trino-server-core from the local repo, so -pl/-am is not
        # sufficient.
        run: |
          ./mvnw clean install \
            -T 1C -DskipTests -Dmaven.javadoc.skip=true -Dair.check.skip-all=true

      - name: Build arm64 image
        run: core/docker/build.sh -a arm64 -x

      - name: Resolve image tag
        id: tag
        # A branch push has no name to take a tag from, so it is published
        # under its commit alone. The other two triggers keep their readable
        # tag, and every run publishes the commit tag as well, because that is
        # what the deploy job records.
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) tag='${{ inputs.tag }}' ;;
            *) if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                 tag="${GITHUB_REF_NAME#posthog-}"
               else
                 tag="${GITHUB_SHA}"
               fi ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        id: push
        # Two tags for one image: the readable one a person asked for, and the
        # commit, which the deploy job pins by digest. A run triggered by a
        # branch push resolves both to the commit, and the second tag and push
        # are then a no-op on the same reference.
        run: |
          set -euo pipefail
          TRINO_VERSION="$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout --raw-streams)"
          docker tag "trino:${TRINO_VERSION}-arm64" "${IMAGE}:${{ steps.tag.outputs.tag }}"
          docker push "${IMAGE}:${{ steps.tag.outputs.tag }}"
          docker tag "trino:${TRINO_VERSION}-arm64" "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"

          # RepoDigests is populated by the push above. Read the entry for this
          # repository, so a digest another tag left behind cannot be picked.
          #
          # No pipeline here. `grep | head` under `set -o pipefail` fails the
          # step when head closes the pipe first, which is a real failure mode
          # in this org (see the same warning in charts state-update.yml).
          digests="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:${GITHUB_SHA}")"
          digest=""
          while IFS= read -r entry; do
            case "${entry}" in
              "${IMAGE}@"*) digest="${entry#*@}"; break ;;
            esac
          done <<< "${digests}"
          if [ -z "${digest}" ]; then
            echo "::error::could not read the digest of ${IMAGE}:${GITHUB_SHA}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  deploy:
    # Tells charts what to run. Charts writes state/trino.yaml and rolls the
    # dev cell; the prod cell waits for promote-to-prod, which the
    # prod-promote-managed-warehouse environment gates.
    #
    # A fork must not deploy PostHog's cells, and a build of some other branch
    # is not what dev should follow. Only a push carries head_commit, which the
    # payload below reads; a manual run of this same branch would send a null
    # commit and charts would record a deploy it cannot attribute.
    needs: build-and-push
    if: >-
      github.repository == 'PostHog/trino'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/ducklake-connector'
    runs-on: ubuntu-latest
    steps:
      - name: Get deployer token
        id: deployer
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}
          owner: PostHog
          repositories: charts

      - name: Record the build in charts
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.deployer.outputs.token }}
          repository: PostHog/charts
          event-type: commit_state_update
          client-payload: |
            {
              "values": {
                "image": {
                  "sha": "${{ github.sha }}@${{ needs.build-and-push.outputs.digest }}"
                }
              },
              "release": "trino",
              "commit": ${{ toJson(github.event.head_commit) }},
              "repository": ${{ toJson(github.repository) }},
              "labels": [],
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }
