name: docker-publish-posthog

# Temporary diagnostic branch workflow. It never publishes release aliases or deploys.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unused compatibility input; image tag is derived from the commit
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: trino-metadata-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'PostHog/trino' && github.ref == 'refs/heads/codex/distinct-metadata-benchmark'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 25
      - name: Build server and CLI from this revision
        run: |
          ./mvnw clean install -pl core/trino-server-posthog,client/trino-cli -am \
            -T 1C -DskipTests -Dmaven.javadoc.skip=true -Dair.check.skip-all=true
      - name: Test changed modules against the built reactor
        run: ./mvnw -pl lib/trino-filesystem,plugin/trino-hoglake test
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Configure registry credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUBLISH_IAM_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076
      - name: Publish diagnostic image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          OCI_SOURCE: https://github.com/PostHog/trino
          OCI_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "::add-mask::${ECR_REGISTRY}"
          image="${ECR_REGISTRY}/posthog-trino:distinct-metadata-${GITHUB_SHA}"
          core/docker/build.sh -a arm64 -p trino-server-posthog -x -o "$image"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$image" | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          echo "Diagnostic image digest: ${digest}" >> "$GITHUB_STEP_SUMMARY"
