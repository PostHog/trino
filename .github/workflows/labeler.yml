name: "Pull Request Labeler"

on:
  # nosemgrep: github-actions-pull-request-target
  # Applies labels to pull requests from forks, which needs write access the
  # pull_request trigger does not give them. Nothing is checked out and no code
  # from the pull request is executed; permissions are contents read and pull
  # requests write.
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

# NOTE: Do not check out/execute code from the PR since a read-write token is present due to pull_request_target
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          # Do not sync labels as this reverts manually added labels such as "tests:all".
          # Syncing labels requires that we define "components" labels.
          sync-labels: false
          configuration-path: .github/config/labeler-config.yml
