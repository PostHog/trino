name: cleanup

# Cancels the runs of a pull request that has closed, which needs a token the
# pull_request trigger does not carry for forks. Nothing is checked out and no
# code from the pull request is executed; permissions are scoped to actions
# alone.
# nosemgrep: dotgithub-repo..semgrep.rules.github-actions-pull-request-target
on:
  # Triggered on every PR merge or close (but with the code and workflow as present in the base of the merge instead of the merge commmit)
  pull_request_target:
    types:
      - closed

# NOTE: Do not check out/execute code from the PR since a read-write token is present due to pull_request_target

# Cancelling a run is all this needs; without an explicit block it would take
# the repository default, which is broader.
permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Cancel Runs For Closed PRs'
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          # Cancel workflow when PR closed. https://github.com/styfle/cancel-workflow-action#advanced-ignore-sha
          ignore_sha: true
          # Note: workflow_id can be a Workflow ID (number) or Workflow File Name (string) or a comma-separated list of those.
          workflow_id: "ci.yml"
          access_token: ${{ github.token }}
